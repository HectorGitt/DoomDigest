<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>DoomDigest Analytics</title>
		<link
			href="https://fonts.googleapis.com/icon?family=Material+Icons"
			rel="stylesheet"
		/>
		<link href="settings.css" rel="stylesheet" />
		<style>
			.analytics-controls {
				display: flex;
				gap: 15px;
				margin-bottom: 20px;
				flex-wrap: wrap;
				align-items: center;
			}

			.control-group {
				display: flex;
				flex-direction: column;
				gap: 5px;
			}

			.control-group label {
				font-size: 14px;
				font-weight: 500;
				color: #374151;
			}

			.control-group select,
			.control-group input {
				padding: 8px 12px;
				border: 1px solid #d1d5db;
				border-radius: 6px;
				font-size: 14px;
				min-width: 120px;
			}

			.analytics-results {
				background: white;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				padding: 20px;
				margin-top: 20px;
			}

			.analytics-header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-bottom: 15px;
				padding-bottom: 15px;
				border-bottom: 1px solid #e5e7eb;
			}

			.analytics-title {
				font-size: 18px;
				font-weight: 600;
				color: #111827;
				margin: 0;
			}

			.analytics-meta {
				font-size: 14px;
				color: #6b7280;
				margin: 5px 0 0 0;
			}

			.analytics-actions {
				display: flex;
				gap: 10px;
			}

			.btn-primary {
				background: #3b82f6;
				color: white;
				border: none;
				padding: 8px 16px;
				border-radius: 6px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 500;
				transition: background-color 0.2s;
			}

			.btn-primary:hover {
				background: #2563eb;
			}

			.btn-secondary {
				background: #f3f4f6;
				color: #374151;
				border: 1px solid #d1d5db;
				padding: 8px 16px;
				border-radius: 6px;
				cursor: pointer;
				font-size: 14px;
				font-weight: 500;
				transition: all 0.2s;
			}

			.btn-secondary:hover {
				background: #e5e7eb;
			}

			.analytics-content {
				font-family: "Segoe UI", system-ui, sans-serif;
				line-height: 1.6;
				color: #374151;
				white-space: pre-wrap;
			}

			.loading-overlay {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background: rgba(0, 0, 0, 0.5);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 1000;
			}

			.loading-content {
				background: white;
				padding: 30px;
				border-radius: 12px;
				text-align: center;
				box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
			}

			.spinner {
				width: 40px;
				height: 40px;
				border: 4px solid #e5e7eb;
				border-top: 4px solid #3b82f6;
				border-radius: 50%;
				animation: spin 1s linear infinite;
				margin: 0 auto 15px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.saved-analytics-list {
				margin-top: 20px;
			}

			.saved-item {
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 15px;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				margin-bottom: 10px;
				background: #f9fafb;
			}

			.saved-item-info h4 {
				margin: 0 0 5px 0;
				font-size: 16px;
				color: #111827;
			}

			.saved-item-meta {
				font-size: 14px;
				color: #6b7280;
			}

			.filter-section {
				background: #f9fafb;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				padding: 20px;
				margin-bottom: 20px;
			}

			.filter-row {
				display: flex;
				gap: 15px;
				margin-bottom: 15px;
				flex-wrap: wrap;
			}

			.customization-panel {
				background: #f9fafb;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				padding: 20px;
				margin-bottom: 20px;
			}

			.customization-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
				gap: 15px;
			}

			.custom-field {
				display: flex;
				flex-direction: column;
				gap: 5px;
			}

			.custom-field label {
				font-size: 14px;
				font-weight: 500;
				color: #374151;
			}

			.custom-field select,
			.custom-field input,
			.custom-field textarea {
				padding: 8px 12px;
				border: 1px solid #d1d5db;
				border-radius: 6px;
				font-size: 14px;
			}

			.custom-field textarea {
				min-height: 80px;
				resize: vertical;
			}
		</style>
	</head>
	<body>
		<div class="header">
			<h1>📊 DoomDigest Productivity Analytics</h1>
			<p>
				AI-powered insights to optimize your content consumption and
				boost productivity
			</p>
		</div>

		<div class="analytics-controls">
			<button id="back-to-settings" class="btn-secondary">
				<span
					class="material-icons"
					style="font-size: 18px; vertical-align: middle"
					>arrow_back</span
				>
				Back to Settings
			</button>

			<div class="control-group">
				<label for="time-period">Time Period</label>
				<select id="time-period">
					<option value="all">All Time</option>
					<option value="today">Today</option>
					<option value="week">This Week</option>
					<option value="month">This Month</option>
					<option value="quarter">This Quarter</option>
					<option value="year">This Year</option>
					<option value="custom">Custom Range</option>
				</select>
			</div>

			<div class="control-group" id="date-range" style="display: none">
				<label>Custom Date Range</label>
				<div style="display: flex; gap: 10px">
					<input type="date" id="start-date" />
					<span style="align-self: center">to</span>
					<input type="date" id="end-date" />
				</div>
			</div>

			<button id="generate-analytics" class="btn-primary">
				<span
					class="material-icons"
					style="font-size: 18px; vertical-align: middle"
					>analytics</span
				>
				Analyze Productivity
			</button>
		</div>

		<div class="customization-panel">
			<h3 style="margin-top: 0; color: #111827">
				Analysis Customization
			</h3>
			<div class="customization-grid">
				<div class="custom-field">
					<label for="analysis-depth">Analysis Depth</label>
					<select id="analysis-depth">
						<option value="brief">Quick Productivity Check</option>
						<option value="standard" selected>
							Reading Habits Analysis
						</option>
						<option value="detailed">
							Deep Productivity Insights
						</option>
						<option value="comprehensive">
							Complete Productivity Report
						</option>
					</select>
				</div>

				<div class="custom-field">
					<label for="focus-areas">Focus Areas</label>
					<select id="focus-areas" multiple size="3">
						<option value="reading-habits" selected>
							Reading Habits & Patterns
						</option>
						<option value="content-quality" selected>
							Content Quality Assessment
						</option>
						<option value="productivity-insights" selected>
							Productivity Insights
						</option>
						<option value="knowledge-gaps">
							Knowledge Gaps & Learning
						</option>
						<option value="time-management">Time Management</option>
						<option value="content-discovery">
							Content Discovery
						</option>
						<option value="personal-growth">Personal Growth</option>
						<option value="recommendations">
							Actionable Recommendations
						</option>
					</select>
				</div>

				<div class="custom-field">
					<label for="output-format">Output Format</label>
					<select id="output-format">
						<option value="structured" selected>
							Productivity Report
						</option>
						<option value="narrative">Reading Journey Story</option>
						<option value="bullet-points">
							Action Items & Tips
						</option>
						<option value="executive">
							Executive Productivity Summary
						</option>
					</select>
				</div>

				<div class="custom-field">
					<label for="custom-prompt"
						>Custom Instructions (Optional)</label
					>
					<textarea
						id="custom-prompt"
						placeholder="Add any specific instructions for the analysis..."
					></textarea>
				</div>
			</div>
		</div>

		<div id="analytics-results" style="display: none">
			<div class="analytics-results">
				<div class="analytics-header">
					<div>
						<h3 class="analytics-title">
							Productivity Analysis Report
						</h3>
						<p class="analytics-meta" id="analytics-meta">
							Generated on <span id="generated-date"></span>
						</p>
					</div>
					<div class="analytics-actions">
						<button id="save-analytics" class="btn-secondary">
							<span
								class="material-icons"
								style="font-size: 18px; vertical-align: middle"
								>save</span
							>
							Save Report
						</button>
						<button id="export-analytics" class="btn-secondary">
							<span
								class="material-icons"
								style="font-size: 18px; vertical-align: middle"
								>download</span
							>
							Export
						</button>
						<button id="copy-analytics" class="btn-primary">
							<span
								class="material-icons"
								style="font-size: 18px; vertical-align: middle"
								>content_copy</span
							>
							Copy
						</button>
					</div>
				</div>
				<div id="analytics-content" class="analytics-content">
					<!-- Analytics content will be inserted here -->
				</div>
			</div>
		</div>

		<div
			class="saved-analytics-list"
			id="saved-analytics"
			style="display: none"
		>
			<h3>Saved Productivity Reports</h3>
			<div id="saved-reports-list">
				<!-- Saved reports will be inserted here -->
			</div>
		</div>

		<script src="analytics.js" type="module"></script>
	</body>
</html>
