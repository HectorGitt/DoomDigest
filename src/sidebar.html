<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>DoomDigest - Auto Summarizer</title>
		<link rel="stylesheet" href="sidebar.css" />
		<link
			href="https://fonts.googleapis.com/icon?family=Material+Icons"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="sidebar">
			<div id="controls">
				<div id="generation-controls">
					<button id="toggle-generation-btn">
						<span class="material-icons">play_arrow</span>
						<span>Start PagePulse</span>
					</button>
					<button id="stop-all-btn">
						<span class="material-icons">stop</span>
						<span>Stop All</span>
					</button>
				</div>
				<div id="feature-controls">
					<button id="auto-snap-toggle-btn">
						<span class="material-icons">flash_off</span>
						<span>Auto Snap: OFF</span>
					</button>
				</div>
			</div>
			<div
				id="loading-indicator"
				style="
					display: none;
					position: fixed;
					top: 50%;
					left: 50%;
					transform: translate(-50%, -50%);
					background: rgba(0, 0, 0, 0.8);
					color: white;
					padding: 20px;
					border-radius: 8px;
					z-index: 1000;
				"
			>
				Processing...
			</div>
			<div id="summaries"></div>
		</div>
		<button id="floating-settings-btn">
			<span class="material-icons">settings</span>
			<span>Settings</span>
		</button>
		<button id="view-all-btn">
			<span class="material-icons">visibility</span>
			<span>View All</span>
		</button>
		<script src="sidebar.js" type="module"></script>
	</body>
</html>
