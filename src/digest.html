<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>DoomDigest - All Digests</title>
		<link rel="stylesheet" href="digest.css" />
		<link
			href="https://fonts.googleapis.com/icon?family=Material+Icons"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="digest-page">
			<header id="digest-header">
				<div class="header-content">
					<h1>DoomDigest</h1>
					<div class="header-actions">
						<button id="back-to-sidebar">
							<span class="material-icons">arrow_back</span>
							<span>Back to Sidebar</span>
						</button>
						<button id="export-btn">
							<span class="material-icons">download</span>
							<span>Export</span>
						</button>
					</div>
				</div>
			</header>

			<div id="filters-section">
				<div class="filters-row">
					<div class="search-group">
						<label for="search-input">
							<span class="material-icons">search</span>
							<span>Search Digests</span>
						</label>
						<input
							type="text"
							id="search-input"
							placeholder="Search by title, content, or URL..."
						/>
					</div>

					<div class="filter-group">
						<label for="date-filter">
							<span class="material-icons">date_range</span>
							<span>Date Range</span>
						</label>
						<select id="date-filter">
							<option value="all">All Time</option>
							<option value="today">Today</option>
							<option value="week">This Week</option>
							<option value="month">This Month</option>
							<option value="quarter">This Quarter</option>
							<option value="year">This Year</option>
							<option value="custom">Custom Range</option>
						</select>
					</div>

					<div class="filter-group">
						<label for="site-filter">
							<span class="material-icons">web</span>
							<span>Website</span>
						</label>
						<select id="site-filter">
							<option value="all">All Sites</option>
						</select>
					</div>

					<div class="filter-group">
						<label for="type-filter">
							<span class="material-icons">category</span>
							<span>Type</span>
						</label>
						<select id="type-filter">
							<option value="all">All Types</option>
							<option value="article">Articles</option>
							<option value="selected-text">Selected Text</option>
							<option value="raw-text">Raw Text</option>
							<option value="explained">Explanations</option>
							<option value="simplified">Simplifications</option>
						</select>
					</div>

					<div class="filter-group">
						<label for="sort-filter">
							<span class="material-icons">sort</span>
							<span>Sort By</span>
						</label>
						<select id="sort-filter">
							<option value="newest">Newest First</option>
							<option value="oldest">Oldest First</option>
							<option value="site">Site (A-Z)</option>
							<option value="title">Title (A-Z)</option>
						</select>
					</div>
				</div>

				<div
					class="custom-date-range"
					id="custom-date-range"
					style="display: none"
				>
					<div class="date-input-group">
						<label for="start-date">From:</label>
						<input type="date" id="start-date" />
					</div>
					<div class="date-input-group">
						<label for="end-date">To:</label>
						<input type="date" id="end-date" />
					</div>
				</div>
			</div>

			<div id="stats-section">
				<div class="stats-grid">
					<div class="stat-card">
						<div class="stat-icon">
							<span class="material-icons">article</span>
						</div>
						<div class="stat-content">
							<div class="stat-number" id="total-count">0</div>
							<div class="stat-label">Total Digests</div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon">
							<span class="material-icons">web</span>
						</div>
						<div class="stat-content">
							<div class="stat-number" id="sites-count">0</div>
							<div class="stat-label">Websites</div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon">
							<span class="material-icons">today</span>
						</div>
						<div class="stat-content">
							<div class="stat-number" id="days-count">0</div>
							<div class="stat-label">Days Active</div>
						</div>
					</div>
					<div class="stat-card">
						<div class="stat-icon">
							<span class="material-icons">trending_up</span>
						</div>
						<div class="stat-content">
							<div class="stat-number" id="avg-daily">0</div>
							<div class="stat-label">Avg per Day</div>
						</div>
					</div>
				</div>
			</div>

			<div id="digest-content">
				<div
					id="loading-indicator"
					style="display: none; text-align: center; padding: 40px"
				>
					<div class="loading-dots">
						<span></span>
						<span></span>
						<span></span>
					</div>
					<p>Loading digests...</p>
				</div>
				<div id="digests-container"></div>
				<div
					id="no-results"
					style="
						display: none;
						text-align: center;
						padding: 40px;
						color: #666;
					"
				>
					<span
						class="material-icons"
						style="
							font-size: 48px;
							display: block;
							margin-bottom: 16px;
						"
						>search_off</span
					>
					<h3>No digests found</h3>
					<p>Try adjusting your search or filter criteria.</p>
				</div>
			</div>
		</div>
		<script src="digest.js" type="module"></script>
	</body>
</html>
